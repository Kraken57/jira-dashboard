modules:
  jira:globalPage:
    - key: enterprise-delivery-kpi
      title: Enterprise Delivery KPIs
      resource: dashboard-ui
      resolver:
        function: dashboard-resolver
  jira:adminPage:
    - key: enterprise-delivery-kpi-admin
      title: Enterprise Delivery KPI Settings
      resource: admin-ui
      resolver:
        function: admin-resolver
  trigger:
    - key: issue-change-trigger
      function: issue-event-handler
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue
  scheduledTrigger:
    - key: incremental-reconciliation
      function: sync-orchestrator
      interval: hour
  consumer:
    - key: jira-sync-consumer
      queue: jira-kpi-sync
      resolver:
        function: sync-worker
  function:
    - key: dashboard-resolver
      handler: src/index.handler
    - key: admin-resolver
      handler: src/admin.handler
    - key: issue-event-handler
      handler: src/events/issues.handler
    - key: sync-orchestrator
      handler: src/sync/orchestrator.handler
      timeoutSeconds: 900
    - key: sync-worker
      handler: src/sync/worker.handler
      timeoutSeconds: 900
  sql:
    - key: main
      engine: mysql

resources:
  - key: dashboard-ui
    path: ../out
  - key: admin-ui
    path: ../out

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - read:sprint:jira-software
    - read:board-scope:jira-software
    - read:issue-details:jira
    - read:worklog:jira

app:
  id: ari:cloud:ecosystem::app/1c8d1c77-a602-4c3a-85fd-b5abdea53e7c
